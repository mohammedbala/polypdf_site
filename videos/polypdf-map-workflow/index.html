<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1710, height=1073">
    <title>PolyPDF full map plan workflow</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1710px;
        height: 1073px;
        margin: 0;
        overflow: hidden;
      }

      body {
        background: #151515;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      #map-workflow-stage,
      #map-workflow-clip,
      .base-frame,
      .motion-layer {
        position: absolute;
        inset: 0;
        width: 1710px;
        height: 1073px;
      }

      #map-workflow-stage {
        overflow: hidden;
        isolation: isolate;
      }

      .base-frame {
        display: block;
        object-fit: fill;
        user-select: none;
        pointer-events: none;
      }

      .plan-sheet {
        position: absolute;
        left: 452px;
        top: 153px;
        width: 1123px;
        height: 853px;
        overflow: hidden;
        background: #fff;
        border: 2px solid #2c3944;
        color: #1f2933;
      }

      .plan-sheet::before {
        position: absolute;
        inset: 18px 18px 114px;
        border: 1px solid #a8b2ba;
        content: "";
      }

      .sheet-kicker {
        position: absolute;
        left: 38px;
        top: 31px;
        z-index: 3;
        padding: 7px 11px 6px;
        border: 1px solid rgba(31, 41, 51, 0.34);
        border-radius: 5px;
        background: rgba(255, 255, 255, 0.93);
        font-size: 12px;
        font-weight: 750;
        letter-spacing: 0.11em;
        text-transform: uppercase;
      }

      .map-frame {
        position: absolute;
        left: 25px;
        top: 17px;
        z-index: 2;
        width: 1070px;
        height: 704px;
        overflow: visible;
        opacity: 0;
        transform-origin: 0 0;
        will-change: transform, opacity;
      }

      .map-viewport {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: #e9eef3;
        border: 3px solid #6f9ff5;
        box-shadow: 0 10px 28px rgba(21, 28, 34, 0.18);
      }

      .map-image {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .north-arrow {
        position: absolute;
        right: 24px;
        top: 24px;
        display: grid;
        width: 46px;
        height: 62px;
        place-items: start center;
        padding-top: 7px;
        border: 1px solid rgba(20, 32, 41, 0.65);
        background: rgba(255, 255, 255, 0.9);
        color: #17232b;
        font-size: 13px;
        font-weight: 800;
      }

      .north-arrow::after {
        position: absolute;
        left: 15px;
        top: 25px;
        width: 0;
        height: 0;
        border-right: 8px solid transparent;
        border-bottom: 23px solid #17232b;
        border-left: 8px solid transparent;
        content: "";
      }

      .map-scale {
        position: absolute;
        left: 25px;
        bottom: 25px;
        width: 174px;
        padding: 7px 10px 6px;
        border: 1px solid rgba(20, 32, 41, 0.65);
        background: rgba(255, 255, 255, 0.92);
        color: #17232b;
        font-size: 11px;
        font-weight: 700;
        text-align: center;
      }

      .map-scale::before {
        display: block;
        width: 100%;
        height: 5px;
        margin-bottom: 5px;
        background: linear-gradient(90deg, #17232b 0 25%, #fff 25% 50%, #17232b 50% 75%, #fff 75%);
        border: 1px solid #17232b;
        content: "";
      }

      .resize-handle {
        position: absolute;
        z-index: 5;
        width: 15px;
        height: 15px;
        border: 2px solid #6f9ff5;
        border-radius: 2px;
        background: #fff;
      }

      .handle-tl { left: -7px; top: -7px; }
      .handle-tr { right: -7px; top: -7px; }
      .handle-bl { left: -7px; bottom: -7px; }
      .handle-br { right: -7px; bottom: -7px; }
      .handle-tm { left: calc(50% - 7px); top: -7px; }
      .handle-bm { left: calc(50% - 7px); bottom: -7px; }
      .handle-ml { left: -7px; top: calc(50% - 7px); }
      .handle-mr { right: -7px; top: calc(50% - 7px); }

      .title-block {
        position: absolute;
        left: 18px;
        right: 18px;
        bottom: 17px;
        display: grid;
        grid-template-columns: 1.55fr 0.75fr 0.42fr;
        height: 96px;
        border: 1px solid #2c3944;
        background: #fff;
      }

      .title-block > div {
        display: flex;
        min-width: 0;
        flex-direction: column;
        justify-content: center;
        padding: 12px 16px;
      }

      .title-block > div + div {
        border-left: 1px solid #2c3944;
      }

      .title-block strong {
        font-size: 17px;
        line-height: 1.1;
        letter-spacing: 0.01em;
      }

      .title-block span {
        margin-top: 7px;
        color: #53606a;
        font-size: 12px;
        line-height: 1.25;
      }

      .title-block .sheet-number {
        align-items: center;
        font-size: 25px;
        font-weight: 800;
      }

      .mutcd-panel {
        position: absolute;
        inset: 0;
        z-index: 10;
        display: block;
        width: 1710px;
        height: 1073px;
        opacity: 0;
        clip-path: polygon(0 80px, 314px 80px, 314px 1041px, 0 1041px);
        object-fit: fill;
        pointer-events: none;
      }

      .placed-sign {
        position: absolute;
        z-index: 8;
        opacity: 0;
        transform-origin: 50% 50%;
        will-change: transform, opacity;
      }

      #stop-sign {
        left: 670px;
        top: 335px;
        width: 76px;
        height: 76px;
      }

      #yield-sign {
        left: 324px;
        top: 520px;
        width: 78px;
        height: 70px;
      }

      .placed-sign img {
        display: block;
        width: 100%;
        height: 100%;
      }

      .sign-selection {
        position: absolute;
        inset: -8px;
        opacity: 0;
        border: 2px dashed #6f9ff5;
      }

      .sign-selection::before,
      .sign-selection::after {
        position: absolute;
        width: 10px;
        height: 10px;
        border: 1px solid #6f9ff5;
        background: #fff;
        content: "";
      }

      .sign-selection::before { left: -6px; top: -6px; }
      .sign-selection::after { right: -6px; bottom: -6px; }

      .cursor {
        position: absolute;
        left: -3px;
        top: -3px;
        z-index: 20;
        width: 30px;
        height: 38px;
        opacity: 0;
        pointer-events: none;
        filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.34));
        will-change: transform, opacity;
      }

      .cursor svg {
        display: block;
        width: 30px;
        height: 38px;
        overflow: visible;
      }

      .cursor path {
        fill: #fff;
        stroke: #151515;
        stroke-width: 1.8px;
        stroke-linejoin: round;
        vector-effect: non-scaling-stroke;
      }

      .cursor-ripple {
        position: absolute;
        left: 7px;
        top: 7px;
        width: 24px;
        height: 24px;
        opacity: 0;
        border: 2px solid #6f9ff5;
        border-radius: 999px;
        transform: scale(0.25);
      }
    </style>
  </head>
