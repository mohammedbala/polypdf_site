name: CI/CD Pipeline for polypdf-site

# Deploys the marketing site to the droplet, where nginx serves the built assets as static files
# straight out of /var/www/polypdf-site/build. There is no app server in front of it.

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  # Two pushes in quick succession would otherwise run two npm builds writing build/ at once.
  group: deploy-polypdf-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add Droplet to Known Hosts
        run: ssh-keyscan -H "${{ secrets.DROPLET_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to Droplet
        run: |
          ssh -o BatchMode=yes "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}" bash -euo pipefail << 'EOF'
            cd /var/www/polypdf-site

            # Fast-forward only. The previous script ran `git stash`, which silently pocketed any
            # work sitting on the droplet; failing loudly on a diverged tree is safer than hiding it.
            git fetch origin master
            git checkout master
            git pull --ff-only origin master

            npm install

            # The droplet runs Node 18, where react-scripts' serialize-javascript dependency reads
            # crypto.getRandomValues off the global object — absent until Node 19. Without this flag
            # the build dies with "crypto is not defined", which is what silently broke this deploy.
            NODE_OPTIONS=--experimental-global-webcrypto CI=false npm run build

            # nginx serves build/ directly, so there is no process to restart. Just prove the build
            # produced a real index.html rather than leaving a half-written directory behind.
            test -s build/index.html
            echo "deployed $(git rev-parse --short HEAD) -> $(ls build/static/js/main.*.js)"
          EOF

      - name: Verify site is live
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://polypdf.com/)
          echo "polypdf.com -> $code"
          test "$code" = "200"
